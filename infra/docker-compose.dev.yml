services:
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Europe/Paris}
      APP_URL: ${APP_URL}
      APP_ENV: ${APP_ENV}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE:-vg}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - ../app:/var/www/html
    depends_on:
      - mysql
      - mongo
      - mailhog

  mysql:
    image: mysql:8.3
    container_name: ${APP_NAME}-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-32803}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dev_mysql_data:/var/lib/mysql
      - ../app/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ${APP_NAME}-pma
    restart: always
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      APACHE_PORT: 80
      HIDE_PHP_VERSION: "true"
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 512M
    depends_on:
      mysql:
        condition: service_healthy

  mongo:
    image: mongo:6.0
    container_name: ${APP_NAME}-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - dev_mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: ${APP_NAME}-mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT:-8084}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${APP_NAME}-mailhog
    restart: always
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"

volumes:
  dev_mysql_data:
  dev_mongo_data:

