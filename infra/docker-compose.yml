services:
  caddy:
    image: caddy:2.7-alpine
    container_name: ${APP_NAME}-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-network

  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-app
    expose:
      - "80"
    environment:
      TZ: ${TZ}
      APP_URL: ${APP_URL}
      APP_ENV: ${APP_ENV}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - /opt/Vite_et_Gourmand/app:/var/www/html
    depends_on:
      - mysql
      - mongo
      - mailhog
    networks:
      - app-network

  mysql:
    image: mysql:8.3
    container_name: ${APP_NAME}-mysql
    restart: always
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ${APP_NAME}-pma
    restart: always
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    environment:
      PMA_HOST: ${MYSQL_HOST}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: ${APP_NAME}-mongo
    restart: always
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: ${APP_NAME}-mongo-express
    restart: always
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    depends_on:
      - mongo
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${APP_NAME}-mailhog
    restart: always
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT}:8025"
      - "127.0.0.1:${MAILHOG_SMTP_PORT}:1025"
    networks:
      - app-network

volumes:
  mysql_data:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
